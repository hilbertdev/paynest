services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: paynest
      POSTGRES_USER: paynest
      POSTGRES_PASSWORD: paynest
    ports:
      - "5432:5432"
    volumes:
      - ./docs/live-sessions/20260723-DatabaseConnection/sql/postgres/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paynest -d paynest"]
      interval: 5s
      timeout: 5s
      retries: 10
